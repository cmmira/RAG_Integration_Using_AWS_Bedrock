<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FAQ Chatbot • Bedrock Knowledge Base</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #020617;
      color: #e5e7eb;
      margin: 0;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 700px;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 14px;
      color: #9ca3af;
      margin-bottom: 16px;
    }

    .card {
      background: #020617;
      border: 1px solid #1f2937;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    label {
      font-size: 14px;
      display: block;
      margin-bottom: 6px;
    }

    textarea {
      width: 100%;
      min-height: 80px;
      background: #030712;
      border-radius: 10px;
      border: 1px solid #1f2937;
      padding: 10px;
      color: #e5e7eb;
      font-size: 14px;
      resize: vertical;
      margin-bottom: 10px;
    }

    button {
      background: linear-gradient(135deg, #22d3ee, #3b82f6);
      color: #020617;
      border: none;
      border-radius: 999px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.7;
      cursor: default;
    }

    .answer-title {
      font-size: 12px;
      text-transform: uppercase;
      color: #9ca3af;
      margin-bottom: 6px;
    }

    .answer-box {
      font-size: 14px;
      white-space: pre-wrap;
      max-height: 260px;
      overflow-y: auto;
    }

    .meta {
      margin-top: 8px;
      font-size: 12px;
      color: #9ca3af;
    }

    .error {
      margin-top: 8px;
      font-size: 13px;
      color: #f97373;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>Ask questions about your knowledge base</h1>
  <p class="subtitle">
    Type a question, optionally add a hint, and let Amazon Bedrock answer using your Knowledge Base.
  </p>

  <div class="card">
    <label for="questionInput">Your question</label>
    <textarea id="questionInput"
              placeholder="e.g., What does the Cloud Architect own during the design phase?"></textarea>

    <label for="contextInput">Optional hint (for better retrieval)</label>
    <textarea id="contextInput"
              placeholder="Optional: add keywords, section names, or any extra clue..."></textarea>

    <button id="askBtn">Ask</button>
    <div id="error" class="error" style="display:none;"></div>
  </div>

  <div class="card">
    <div class="answer-title">Latest answer</div>
    <div id="answer" class="answer-box">No answer yet.</div>
    <div id="meta" class="meta"></div>
  </div>
</div>

<script>
  // Replace with AWS Lambda Function URL
  const FUNCTION_URL = "YOUR_LAMBDA_FUNCTION_URL_HERE";

  const questionInput = document.getElementById("questionInput");
  const contextInput = document.getElementById("contextInput");
  const askBtn = document.getElementById("askBtn");
  const errorEl = document.getElementById("error");
  const answerEl = document.getElementById("answer");
  const metaEl = document.getElementById("meta");

  function showError(msg) {
    errorEl.style.display = "block";
    errorEl.textContent = msg;
  }

  function clearError() {
    errorEl.style.display = "none";
    errorEl.textContent = "";
  }

  askBtn.onclick = async () => {
    clearError();
    metaEl.textContent = "";

    const question = questionInput.value.trim();
    const context = contextInput.value.trim();

    if (!question) {
      showError("Please enter a question.");
      return;
    }

    askBtn.disabled = true;
    askBtn.textContent = "Asking...";

    try {
      const res = await fetch(FUNCTION_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, context })
      });

      if (!res.ok) {
        const text = await res.text();
        showError("Error from backend: " + text);
        answerEl.textContent = "No answer.";
        return;
      }

      const data = await res.json();

      if (data.error) {
        showError(data.error);
      }

      answerEl.textContent = data.answer || "No answer returned.";

      if (typeof data.citation_count === "number") {
        metaEl.textContent =
          "Answer is based on " + data.citation_count + " retrieved chunk(s) from your Knowledge Base.";
      }
    } catch (err) {
      console.error(err);
      showError("Network error calling Lambda Function URL. Check the browser console.");
      answerEl.textContent = "No answer.";
    } finally {
      askBtn.disabled = false;
      askBtn.textContent = "Ask";
    }
  };
</script>
</body>
</html>
